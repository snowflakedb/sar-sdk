# Runs the Node.js SDK against a real Snowflake test account, which the offline checks in
# test-nodejs.yml never do. It needs credentials, so it runs only in the development repository.
name: Node.js SDK integration tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: sdk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: nodejs
jobs:
  integration:
    name: Real account
    # The public mirror belongs to another organization, so this job never runs there. Matching the
    # owner rather than the full repository name keeps the private repository's name out of a
    # published file.
    if: github.repository_owner == 'snowflake-eng'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: nodejs/package-lock.json
      - run: npm install --global npm@11.18.0 --ignore-scripts
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # The test names any variable it is missing, so an unconfigured secret fails with a message
      # rather than being skipped. Secret values are never printed.
      - run: npm run test:integration
        env:
          SNOWFLAKE_TEST_ACCOUNT: ${{ secrets.SNOWFLAKE_TEST_ACCOUNT }}
          SNOWFLAKE_TEST_USER: ${{ secrets.SNOWFLAKE_TEST_USER }}
          SNOWFLAKE_TEST_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_TEST_PRIVATE_KEY }}
          SNOWFLAKE_TEST_PRIVATE_KEY_PASSWORD: ${{ secrets.SNOWFLAKE_TEST_PRIVATE_KEY_PASSWORD }}
          SNOWFLAKE_TEST_HOST: ${{ secrets.SNOWFLAKE_TEST_HOST }}
          SNOWFLAKE_TEST_ROLE: ${{ secrets.SNOWFLAKE_TEST_ROLE }}
          SNOWFLAKE_TEST_WAREHOUSE: ${{ secrets.SNOWFLAKE_TEST_WAREHOUSE }}
